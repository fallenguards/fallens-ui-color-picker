name: Feature Request
description: Something the addon should do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This tracker is for **Fallen's UI Color Picker**: its folder is `FallensUIColorPicker` and its options open with `/fcui`.
  - type: textarea
    id: request
    attributes:
      label: What would you like?
      description: What it should do and what it would be for. A screenshot of the part of the screen helps.
    validations:
      required: true
